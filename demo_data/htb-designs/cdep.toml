<markdown>
    # Detection Engineering Methodology {.in-toc.numbered}
    For every task in this engagement, the same five-step detection-engineering loop is applied:

    1. **Characterize the behavior:** from the recovered sample (capability analysis) and/or telemetry, understand how the technique works, so that the detection targets behavior rather than a hash or filename.
    2. **Map to ATT&CK:** identify the technique / sub-technique the analytic covers.
    3. **Author the analytic:** write the detection over the correct data source (Sysmon, the relevant ETW provider, ETW-TI, Security, or auditd).
    4. **Validate:** run it against the captured corpus and confirm it fires on the true positive.
    5. **Submit proof-of-detection:** the field value the validated analytic returns is the evidence that the rule works. That value is the flag.

    <pagebreak />
</markdown>

