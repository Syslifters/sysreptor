text = """# German report language

## Purpose

German (de-*) overlay — register, hedges, typography, and the few phrasing
deltas that differ from the English field resources. Field structure, lengths,
and content integrity stay there. This file is **not** a second field manual —
apply it after the matching English field resource, then write German.
Applies to both writing modes: new German prose and rewriting German source.

## Applies to

Every prose field when the report is German (`language: de-*`, the user asks
for German or Deutsch, or existing or new prose is German).

## Rules

- **Locale.** `language` is any `de-*` locale; `references/report-metadata.md`
  owns the default (`de-DE` when German is asked for without a variant).
  Rewrite: keep the source’s variant.
- Keep established English security terms (CSRF, JWT, MFA, PoC, Finding, Scope,
  Race Condition). Do not paste English example sentences from this skill into
  German fields.

### Register

- **Past tense + active voice for what testers did.** “Wir identifizierten …”,
  “Wir konnten … auslesen”, “stellten wir fest”. Prefer a finite verb over a
  nominalization (“wir konnten uns anmelden”, not “wir konnten eine Anmeldung
  durchführen”).
- **Conditional for potential impact.** Demonstrated: past indicative
  (“erhielten wir Zugriff”). Attacker *could* reach: “könnte”, “könnten
  Angreifer”, “wäre … möglich”.
- **First person plural:** “wir” / “uns”. Client is third person. Never “man”
  as the subject of test actions; never second person outside recommendations.
  - Unwrap agentless tester passives: “Es wurde festgestellt, dass …” →
    “Wir stellten fest, dass …”.
  - A stable mechanism does not need that frame.
  - Customer-side provisioning may stay impersonal when that is the source
    stem; tester registration stays first person.
- **Hedges:** `auskunftsgemäß` / `laut Auskunft` (client-stated);
  `vermutlich` / `offenbar` / `schien` (inference); `könnte` / `wäre denkbar`
  (not demonstrated). `denkbar, dass … könnten` is one hedge, not a stack.
  Do not upgrade “könnte” to “konnten wir”. A real `denkbar` / trade-off
  `könnte` in recommendations stays optional. Keep content adverbs (`jedoch`,
  `jedenfalls`, `ggfs.`).
- **Severity:** kritisch, hoch, mittel, niedrig. Dimensions: Vertraulichkeit,
  Integrität, Verfügbarkeit.
- **Typography:** “z. B.”, “bzw.”, “ggf.”; thousands with a dot
  (“1.250 Rechnungen”); quotes „…“ for UI labels. Rewrite: keep the source’s
  spacing and quote characters on that sentence.
- **Same term, one spelling inside a field.** From scratch: prefer hyphenated
  Duden forms (`SSH-Port`). Leave grammar-driven variants alone.
- Finite-verb choice is not a typo (“sendeten wir” stays): pick the finite verb
  the evidence supports. Rewrite: no grammar-only pass.

### Deltas from English field files

Structure, lengths, and content integrity still come from the English field
resource named in each heading. Only these realizations change.

#### Titles (`references/finding-titles.md`)

- Weave the cause in with `durch` / `über` / `bei`, or with a verb. German does
  not take the English parentheses-for-the-class shape (`Kontoübernahme (XSS)`).
- Parentheses only for a qualifier (“(nur Staging)”).
- Join co-equal impacts with “und”. Unexecuted risk: “Risiko durch …”.
- Shapes: `<Auswirkung> durch <Ursache>`, `<Auswirkung> über <Weg>`,
  `<Komponente> ermöglicht <Auswirkung>`, `<Komponente> ohne <Kontrolle>`.

#### Recommendations (`references/recommendations.md`)

- Concrete change → ihr-imperative (“Stellt sicher, dass …”, “Deaktiviert …”,
  “Erzwingt MFA am VPN”). Never “Sie sollten …”.
- Process advice → “Wir empfehlen …”. Hard requirement → “müssen” / “soll”.
- Keep `nach Möglichkeit` on the restyled imperative. Rewrite: a source
  `sollte` may stay.

#### Exploitability grades (`SKILL.md`, impact and certainty)

- “kein besonderes Fachwissen notwendig”; “technisch anspruchsvoll” / “in
  nahezu Echtzeit”; “war nicht zuverlässig reproduzierbar”; “die praktische
  Ausnutzung war stark eingeschränkt”.

#### Scoring rationale (`references/cvss-scoring.md`)

- “haben wir dieses Finding heruntergestuft” / “wurde in der Bewertung
  berücksichtigt.”

#### Executive close (`references/executive-summary.md`)

> Wir empfehlen, Schwachstellen mit kritischem und hohem Schweregrad
> priorisiert zu beheben. Alle anderen Schwachstellen sollten nach Aufwand
> priorisiert und im Rahmen eines kontinuierlichen Verbesserungsprozesses
> adressiert werden.

#### Retest formulas (`references/retest-fields.md`)

- Resolved: “Im Retest nicht mehr reproduzierbar.”
- Dated status block: `**Status 08.05.2026:**` — German date style, newest
  first.

#### History and duration labels (`references/document-history.md`)

- History `description`: `Entwurf`, `Freigabe` / `Review & Freigabe`, `Retest` /
  `Weiterer Retest`.
- Duration in `scope`: “X Personentage”, optionally “inklusive
  Berichtserstellung”.

#### Cross-links and appendix (`references/references-and-crosslinks.md`, `references/evidence-and-poc.md`)

- Cross-link: “(Finding [](#id))” / “(siehe Finding: _[](#id)_)”.
- Appendix pointer: `Siehe Anhang: …` / `Anhang: …`. Rewrite: keep the source
  prefix.
- Knowledge base: “Weitere Informationen zu dieser Schwachstelle sind in
  unserer Wissensdatenbank dokumentiert.”

## Examples

- Observation: “Wir riefen den Password-Reset wiederholt auf; die Anwendung
  versandte jedes Mal eine E-Mail ohne erkennbare Limitierung.”
- Mechanism: “Die VPN-Anmeldung prüfte nur Benutzername und Passwort; ein
  zweiter Faktor fehlte.”
- Potential: “Ohne MFA könnten Angreifer gestohlene VPN-Zugangsdaten direkt
  verwenden.”
- Client-stated: “Auskunftsgemäß handelt es sich um das zentrale
  Abrechnungssystem.”
- Title: `Übernahme von Shop-Administratoren durch gespeichertes XSS` — not
  `Kontoübernahme (XSS)`.
- Recommendation pair: “Erzwingt Multifaktor-Authentifizierung für alle
  VPN-Anmeldungen.” / “Wir empfehlen, privilegierte Fernzugänge zusätzlich an
  verwaltete Geräte zu binden.”

## Avoid

- English prose in any field (embedded English terms are fine).
- Copying English title parentheses, “Ensure …”, or “person-days” into German.
- Present or future tense for test actions.
- Double filler hedges (“könnte möglicherweise eventuell”).
- Agentless passive for our own steps (“Es wurde versucht, …”).
- Blame language (“nachlässig konfiguriert”).
- Re-stating field lengths, CVSS order, or PoC placement — those stay in the
  matching English field resource.
"""

