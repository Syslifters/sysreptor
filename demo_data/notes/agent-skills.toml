text = """---
name: report-writing
description: >
  Structure, register, and field defaults for penetration-test reports. Use when
  drafting, rewriting, or reviewing any finding or report-section field — title,
  summary, description, recommendation, cvss, affected_components, scope,
  executive_summary, retest — including empty fields, tester notes turned into
  prose, and requests to "draft" or "improve" a field without naming it. Applies
  when the user is working inside a finding or report section even if they never
  say "pentest" or "report". Examples are English (en-US); German (de-*) reports
  additionally use the German overlay.
license: MIT
metadata:
    version: "1.0"
    author: SysReptor Team
---

# Report writing

These references teach **how a strong penetration-test report should read**:
field goals, lengths, defaults, register, and content integrity, so you can
**write a field from scratch** or **rewrite one field at a time**. The user may
be inside a finding or section, or asking for a new field, finding, or report
section.

Examples in this skill are **English**. Draft English reports from them
directly. For German reports (`language: de-*` or German source prose), keep the
field structure here and apply `references/german.md` — do not paste English
example sentences into German fields.

## How to use

1. **Identify the fields** to write, and **read each field’s resource from the
   index below before drafting it**. Write only the fields asked for. A new
   finding, unless scoped narrower, is `title`, `summary`, `description`,
   `cvss`, `recommendation`, `affected_components`, plus the retest fields when
   this is a retest. Do not assemble a full report unless asked.
2. **Pick the mode per field** (see *Two modes*). Source prose in the field →
   rewrite. Empty field, notes only, or an explicit draft request → from
   scratch. Mixed requests apply per field.
3. If the report is German, also read `references/german.md`.
4. Apply the field’s resource plus the always-on rules below: content
   integrity, impact and certainty, and register.

## Field index

Read the resource for the field you are writing.

| Field | Resource |
| --- | --- |
| Report `title`, `customer`, dates, `is_retest`, `lead_pentester`, `language` | `references/report-metadata.md` |
| `scope` (with approach and duration) | `references/scope-and-methodology.md` |
| `executive_summary` | `references/executive-summary.md` |
| `document_history` | `references/document-history.md` |
| Finding `title` | `references/finding-titles.md` |
| Finding `summary` (non-technical, for management) | `references/finding-summaries.md` |
| Finding `description` (technical body, repro steps) | `references/finding-descriptions.md` |
| `cvss` and severity words | `references/cvss-scoring.md` |
| `recommendation` | `references/recommendations.md` |
| `affected_components` | `references/affected-components.md` |
| `retest_status`, `retest_notes` | `references/retest-fields.md` |

Cross-cutting resources, used alongside a field resource:

| Topic | Resource |
| --- | --- |
| Screenshots, `[TODO IMAGE]` placeholders, PoC blocks, appendix pointers | `references/evidence-and-poc.md` |
| Finding cross-links, external references, footnotes | `references/references-and-crosslinks.md` |
| Markdown dialect: headings, emphasis, lists, figures, tables, fences | `references/markdown-syntax.md` |
| German (`language: de-*`) register and phrasing deltas | `references/german.md` |

The report design owns the field inventory: write the fields it has, and do not
invent a field it does not have.

## Two modes

Only these two terms are used, here and in every field resource.

* **From scratch** — empty field, tester notes, evidence, a new finding, or an
  explicit “draft / write the summary”. Compose the field’s target shape from
  available facts.
  - Facts come from the user, tester notes, evidence, and other fields already
    in the report. Do not invent hosts, scores, findings, or polarity.
  - If a **required** fact is missing, ask. Optional slots stay omitted.
  - Use this skill’s defaults (language, typography, the markup defaults below,
    inclusion checklists, executive close) and the structure the field resource
    describes: numbered steps, sub-headings for distinct sub-issues, bullets,
    finding links.
  - A `Rewrite:` tag never applies. Those tags preserve existing text; they do
    not forbid structure the field is supposed to have, and they are not a
    reason to leave a field incomplete.
* **Rewrite** — existing source prose in that field. Restyle in place: wording,
  tense, register, paragraphing, list structure, and headings may change.
  - Facts, hedges, claim strength, verbatim technical strings, and field
    boundaries stay.
  - Keep source order, list markers, and spacing unless the field resource says
    to restore a structure (flattened lists → bullets).
  - Improving means making the text read like a strong report, not
    reconstructing a known twin.

## Markup defaults

Enough to write a prose field without opening another file. The dialect,
its examples, and everything not listed here — tables and their captions,
manual highlighting inside a fence, mermaid, attribute braces, inline HTML —
are in `references/markdown-syntax.md`.

* **Headings:** never `#`, `##`, or `###` inside a field; the design owns those
  levels. `####` and `#####` structure a long PoC.
* **Lists:** `*` or `-`, one marker per field, no blank lines between adjacent
  bullets, alternatives nested under their parent. `1.` `2.` `3.` when order
  matters. A single item is a plain sentence with no marker.
* **Inline:** backticks for endpoints, parameters, files, commands, status
  codes, and field values. Bold sparingly, for a critical identifier or count —
  never a whole sentence. No underline, and no strikethrough to mark a fixed
  issue.
* **Figures:** `![Caption](file.png)` — the alt text renders as the caption and
  is never empty. `[TODO IMAGE]` where the screenshot is still missing. Either
  form sits on its own line with a blank line around it, directly after the
  sentence it proves.
* **Fences:** every code block carries its language (`http`, `sql`, …).

## Content integrity

Style may change; facts and claim strength may not. This holds for every prose
field in both modes. The following may not change relative to the **available
source** — existing field text, other report fields, tester notes, evidence,
user-supplied facts:

- **Facts:** hosts, URLs, counts, names, versions, dates, CVSS vectors,
  severities, and which findings exist. Do not invent any of them.
- **Claim strength:** a hedged claim stays hedged; a demonstrated claim stays
  demonstrated. Do not upgrade a possibility to a completed tester action
  because another field later proves a related step.
- **Genuine uncertainty** already in the source: client-stated facts, inference
  markers, residual possibilities, limitations we could not close.
- **Verbatim technical strings:** group names, error messages, field values,
  paths, and quoted UI labels, even when they look like typos.
- **Recommendation optionality:** a real optional / trade-off hedge stays
  optional; do not promote it to a hard must.
- **Field boundaries:** do not move a duration comment from `scope` into
  `executive_summary`, a caveat from `summary` into the management overview, or
  a fix list from `recommendation` into `description`.

If a fact required by the field is missing, ask the user. Do not reconstruct a
known twin or fill gaps from general knowledge of the stack.

Avoid:

- Inventing hosts, scores, findings, or a polarity the available facts do not
  support.
- Unifying hedges or modals across fields “for consistency”.
- Grammar-only passes that change a finite-verb choice the source already used
  (rewrite only).

## Impact and certainty

Impact, exploitability, and certainty are distributed across `title`, `summary`,
`description`, and `executive_summary`. Keep that wording consistent in both
modes. German hedges and grades: `references/german.md`.

- **Demonstrated outcomes** — past indicative, first person, concrete object:
  “we obtained access to the invoice database”, “we were able to take over 12
  customer accounts”.
- **Potential outcomes** — conditional: “attackers could …”, “would be
  possible”. Never state potential impact as fact.
- **One precise certainty marker**, chosen from the evidence:
  - “according to the client” / “the client stated” — client-stated
  - “presumably” / “apparently” — our inference
  - “could” / “it is conceivable that” — not demonstrated

  Evidence-backed facts carry no hedge. Say when we could not determine
  something, and do not add filler hedges.
- **Preconditions travel with the impact** when they change who can exploit it.
  Drop only a tautology that restates the same sentence. Keep extra constraints
  (VPN access, known password, valid URL before the victim).
- **Do not tack a vague sequel onto a concrete consequence** — keep the concrete
  effect; drop an empty “far-reaching consequences” tail.
- **Grade exploitability with matching vocabulary:**
  - trivial: “no specialized expertise required”
  - involved: “technically demanding”, “in near real time”
  - unreliable: “was not reliably reproducible”
  - blocked / limited: “practical exploitation was severely limited”
- **Business consequences** are plausible operational risks, never certain
  events. Do not claim fines, reputational damage, or compliance breaches:
  they were not in scope and not evidenced. This holds in every field.
- **Chains** state the demonstrated step and what the chain *would* enable, with
  a single cross-link. Do not rewrite a hedged `summary` into a demonstrated
  past because `description` later proves a related step.
- **Mechanism vs undemonstrated step.** Observed configuration and capability
  given a precondition → present indicative. Attacker steps we did not perform →
  conditional. Do not flatten both to present, and do not upgrade an
  undemonstrated step to an executed one.
- **Caveats keep their scope.** A limitation on one sub-issue is not merged onto
  every account or endpoint in the finding.
- Screenshots that show a fact make *that* fact unhedged; interpretation of
  unevaluated contents may stay hedged.
- **Hedges stay with their facts, per field.** Rewrite: keep content hedges and
  drop filler stacks; do not add a hedge the field did not use. Conflicting
  qualifiers or modals across fields of one finding stay independent. Do not
  copy a finding hedge onto an `executive_summary` sentence that already stated
  the fact unhedged — unless a client-stated fact appears in the executive text
  *for the first time*, in which case it keeps the finding’s hedge.

Examples:

- Demonstrated + potential + precondition:

  > Unauthenticated users could view a list of invoice PDFs at a guessed URL.
  > Knowing the object ID is required; we found no systematic enumeration.

- Graded exploitability:

  > Exploitation is only conceivable in near real time because the session URL
  > expires after a few minutes. That strongly reduces the risk.

Avoid:

- Double filler hedges; hedging verified facts.
- Severity adjectives in prose (“very dangerous vulnerability”).
- Speculating about motives or why a setting exists.

## English register

`references/report-metadata.md` owns the `language` default; do not mix locales
inside a field.

* Past tense and active voice for what testers did (“We identified …”, “we
  determined”). Present tense for lasting mechanisms. Conditional for potential
  impact (“could”, “would be possible”). Prefer a finite verb over a
  nominalization (“we signed in”, not “we performed a login”).
* First-person plural for tester actions (`we` / `us`). The client is third
  person. Unwrap agentless tester passives (“It was determined that …” → “We
  determined that …”). A stable mechanism does not need that frame.
* Hedging uses the certainty markers above. Drop filler wrappers; keep content
  adverbs.
* Severity words are Critical, High, Medium, and Low, derived from the score
  (`references/cvss-scoring.md`). Impact dimensions (confidentiality,
  integrity, availability) belong in prose when they explain a rating.
* Typography: “e.g.”, “i.e.”; thousands with a comma (“1,250 invoices”); “…”
  for UI labels; backticks for technical identifiers. Do not use em-dashes
  (`—`); prefer a comma, period, colon, or parentheses. Rewrite: replace source
  em-dashes the same way unless they sit inside a verbatim technical string.
  Keep the source’s spacing and quote characters on that sentence.
* Keep established English security terms (CSRF, JWT, MFA, PoC).
"""

