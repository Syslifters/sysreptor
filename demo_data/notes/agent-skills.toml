text = """# Finding summaries

## Purpose

Rules for finding `summary`. Management audience; impact first; plain
language; verified outcomes; requirements and limitations.

## Applies to

Finding `summary`.

## Rules

- **1–5 sentences** (rarely a sixth for a hard chain), usually one paragraph;
  a second short paragraph is for caveats, mitigations, or a chain link. Roughly
  25–130 words. Cover impact, actor, how, and limitations in that range. Never
  pad, and do not merge distinct claims to hit a paragraph cap. A simple scan
  leftover may be one sentence.
- **Impact and actor first**, in language a manager can use. Opening shapes:
  - “We identified / determined / obtained …”
  - “Unauthenticated / arbitrary users could …”
  - “The application implemented no … that would prevent …”
  Pick the shape that matches the evidence; do not paste an example that does
  not fit the facts. Rewrite: restore the source’s finite verb rather than
  swapping in an example opener.
- **Then, briefly:** how, in business terms (mechanism as a side-note, not a
  payload); **who can exploit it**; **limitations** that change prioritization.
- **Caveats and scoring rationale when they change the reading.** If
  exploitation is hard, say so and, when it moved the rating, say that too
  (“The risk is reduced because …. This was reflected in the rating.” / “… we
  downgraded this finding.”). Do not hide a real precondition.
- **No dump of URLs, payloads, status codes, or CVSS vectors.** Reproduction
  belongs in `description`. Name a field or control when *it is* the object at
  risk. Rewrite: do not strip a name the original already used, and do not add
  paths the summary never had.
- **Quantify** exposure with counts and data types when known. Keep the
  field’s own qualifier (do not unify wording across `summary` and
  `description`).
- **One general-explanation sentence** is allowed on a hardening finding
  (why attackers care about the missing control). Keep it to one sentence.
- **Aggregation stays aggregated:** how much, top risk. Exemplars and
  inventories live in `description`. Do not import a description-only caveat
  into `summary`.
- A chain-level impact that only the worst sub-issue justifies may close the
  summary, with the modal the evidence supports. Rewrite: keep the original
  modal — a hedge stays hedged.
- Keep the impact-consequence sentence after a mechanism lead; strip only
  fluff wrappers around it (content integrity).
- Present tense is right for a missing control that is a stable property
  (“The endpoint does not validate whether …”).
- Cross-link chained findings once, inline (`references/references-and-crosslinks.md`).
- Expand the title for a management reader; do not repeat it word for word.

## Examples

- Impact + actor + caveat:

  > Any shop user could change other accounts’ passwords, including the
  > administrator’s. During the test we took over the administrator account that
  > way and saw all orders. A valid customer login is required; unauthenticated
  > attackers cannot use the path.

- Scoring mitigation:

  > The risk is reduced because file URLs have a short validity window. That
  > makes targeted abuse harder and was reflected in the rating.

- Too technical:

  > The application stores `userId` without integrity protection. We sent
  > `GET /admin` and received HTTP 200. CVSS 8.8.

## Avoid

- Opening on the vulnerability class or the vector.
- Unqualified worst cases beyond what was tested.
- Dropping a real exploitability caveat.
- A summary that could apply to any client — name the system, data, and roles.
- Reproduction steps, payloads, or a URL list.
- Repeating the title word for word.
"""

