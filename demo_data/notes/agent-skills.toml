parent = "6241e3a4-26dc-4f7f-9bfc-3d695aea9393"
order = 1
text = """# Affected components

## Purpose

How `affected_components` should read: a short, machine-usable list of what to
fix or retest. Complements the where / host / path requirement in
`references/finding-descriptions.md`.

## Applies to

`affected_components` of every finding.

## Rules

- **A list of strings**, typically 1–7 entries, one component per entry. Never
  a comma-joined sentence, never prose.
- **Each entry is a concrete pointer:**
  - Web: full URL with host and path. Prefix the method when the issue is
    method-specific (`PUT https://shop.example.com/api/basket/item`).
  - Path parameters: `{Name}` or `:name` — pick one style per report.
  - Infrastructure: hostname, GPO name, AD object, subnet, or the named
    mechanism (`VPN concentrator`, `domain controller`).
  - When there is no URL: a descriptive pointer
    (`VPN login without a second factor`, `email field on the login form`).
  - Bulk evidence: an appendix pointer, `See appendix: <file>`
    (`references/evidence-and-poc.md`). Rewrite: keep the source prefix.
- List every primary endpoint or named mechanism from `description`; one
  concrete pointer per entry.
- **Frozen when rewriting**, including spelling that disagrees with finding
  prose. The list is a pointer, not a synonym to unify.
- **Consistency:** every listed component appears in (or is clearly implied by)
  `description`; every primary endpoint in `description` appears here. No
  duplicates. Staging and production each get their own host entry.

## Examples

- Web: `https://shop.example.com/login`,
  `https://shop.example.com/api/invoices/{invoiceId}`
- Infra: `GPO: Desktop firewall`, `vpn.example.com`
- Appendix: `See appendix: leaked-credentials.csv`

## Avoid

- Bare domains when a path is known, unless the whole site is affected.
- Vague entries (“the application”, “various endpoints”).
- Components mentioned nowhere in `description`, or primary endpoints missing
  here.
- Prose inside an entry (“… and also …”).
- Rewriting list spelling to match finding prose.
"""

[[notes]]
title = "cvss-scoring.md"
id = "5a7cd6c5-2e2d-4c17-b50c-6228531176e2"
type = "text"
parent = "6241e3a4-26dc-4f7f-9bfc-3d695aea9393"
order = 2
text = """# CVSS scoring

## Purpose

Rules for `cvss`. One final rating per finding, the severity word it maps to,
and the rationale in prose.

## Applies to

`cvss` of every finding, and scoring rationale in `summary` or `retest_notes`.

## Rules

- **Exactly one CVSS v3.1 vector** per finding, starting `CVSS:3.1/`. No bare
  numeric score as the rating, no second competing score, no CVSS v4.0.
- **Base metrics complete, canonical order:** `AV`, `AC`, `PR`, `UI`, `S`,
  `C`, `I`, `A`.
- **Temporal / environmental metrics only when they reflect the finding**
  (functional exploit `E:H`, unproven `E:U`, official fix `RL:O`, confidence
  `RC:R` / `RC:U`, lowered requirements `CR:L` / `IR:L`). Default: base only.
  Do not append extras to deflate a score.
- **Severity words come from the score**, so prose and vector cannot disagree:
  - `0.1–3.9` → Low
  - `4.0–6.9` → Medium
  - `7.0–8.9` → High
  - `9.0–10.0` → Critical

  German equivalents are in `references/german.md`. Use the word, not the
  number, in prose; the number lives in the vector.
- **Score what was demonstrated, on the demonstrated chain.** Produce one v3.1
  vector from those facts, and ask if a metric cannot be determined. Do not
  invent temporal metrics.
  - Preconditions → `PR` (what the attacker needs), not what they would need
    to *discover* the endpoint.
  - Unreliable exploitation (entropy, short windows) → `AC:H` **and** name it
    in `summary`.
  - Client-side execution across a trust boundary (XSS in the browser) → `S:C`.
- **Rationale lives in prose, not in the vector.** Downgrades and mitigations
  belong in `summary` or `retest_notes` (“we downgraded this finding”, “this
  was reflected in the rating”). Do not quote metric definitions in the report.
- On retest, an updated vector is documented in `retest_notes`
  (`references/retest-fields.md`).
- The titled impact must stay compatible with C/I/A (`references/finding-titles.md`).

## Examples

- Base: `CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:H/I:H/A:N` — 8.8, High
  (authenticated SQLi on the account API, read and write access to account
  data).
- With temporal metrics for known issues in outdated software:
  `CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:L/I:L/A:N/E:U/RL:O/RC:U`

## Avoid

- “CVSS 7.5” without a vector; pasting the vector into `summary`.
- Two ratings (prose severity that contradicts the vector or its band).
- Inventing temporal metrics that are not evidenced.
"""

[[notes]]
title = "document-history.md"
id = "a9e9a497-9873-4ae7-9310-c7e7fde97178"
type = "text"
parent = "6241e3a4-26dc-4f7f-9bfc-3d695aea9393"
order = 3
text = """# Document history

## Purpose

How `document_history` entries should read: a few words per version, not prose.
German labels: `references/german.md`.

## Applies to

`document_history`, where the report design has it. Its entries usually consist
of `description`, `authors`, `date`, and `version`.

## Rules

- **The design owns the field inventory.** `document_history` may carry a
  different set of sub-fields in another design, or may not exist at all. Write
  the sub-fields the design actually has, leave out the ones it does not, and do
  not add the field to a report whose design has no history. Ask if you cannot
  tell which sub-fields exist.
- One entry per version, **earliest first** (retest status blocks run the other
  way — newest first, `references/retest-fields.md`).
- **`description`:** a few words, not a sentence. Typical vocabulary: `Draft`;
  `Release` / `Review & release` / `Initial creation and release`; `Retest` /
  `Further retest`.
- **`version`:** draft `0.1` / `0.9`; initial release `1.0`; retests as a minor
  bump (`1.1`) or a major bump (`2.0`) when the engagement treated it as a new
  major version. Do not skip stages without a corresponding event.
- **`authors`:** one person per array item (no “and” inside
  an item). Comma-separate in non-array string fields.
- **`date`:** ISO `YYYY-MM-DD`. The newest release date matches `report_date`
  (or `retest_date`). Ask for authors or dates if unknown.
  From scratch: draft + release at minimum, plus a retest entry when this is a
  retest. Rewrite: leave an existing mismatch frozen
  (`references/report-metadata.md`).

## Examples

- `0.1` / Draft — John Doe, Jane Doe.
- `1.0` / Review & release — Juanita Doe.
- `1.1` / Retest — Jane Doe.

## Avoid

- Paragraph-length descriptions.
- Inventing a review entry nobody performed.
- Reordering dates; “fixing” an existing `report_date` / history mismatch.
- Switching author token types to match an example in another skill.
"""

[[notes]]
title = "evidence-and-poc.md"
id = "38bd150f-4636-471f-b02c-5130a91f96fd"
type = "text"
parent = "6241e3a4-26dc-4f7f-9bfc-3d695aea9393"
order = 4
text = """# Evidence and PoC

## Purpose

How evidence reads inside prose fields: screenshot placement, the two image
forms, fenced PoCs, and when bulk evidence moves to an appendix. Markdown
syntax for all of it is in `references/markdown-syntax.md`.

## Applies to

`description`, `retest_notes`, and rarely `scope` — anywhere images, fenced
code, or an appendix pointer appears.

## Rules

### The two image forms

- **A real screenshot** is a markdown image whose alt text renders as the figure
  caption: `![Caption](screenshot.png)`. The caption names what the figure
  shows; alt text is never empty.
- **`[TODO IMAGE]`** marks a screenshot the pentester still has to insert. Use
  it when the walkthrough needs evidence at that point but the file is not
  available to you. It carries no caption and no number.
- Both forms sit **on their own line**, never inside a sentence, with a blank
  line before and after. Rewrite: keep the source’s spacing, including a
  leading space on the line if it has one.

### Placement

- **Directly after the sentence it proves.** That sentence states the claim; the
  figure caption names the artifact. Neither is a “see screenshot:” pointer.
- One claim sentence per figure. Typical density is 1–6 figures in a field; long
  PoCs may carry one per step. Two or three consecutive figures are fine when
  they belong to one statement — pair them in one side-by-side figure when they
  are two halves of the same artifact (`references/markdown-syntax.md`).
- Never cluster the figures at the end of the field.
- An ellipsis may continue a sentence across a figure:

  ```
  The error message contained the first rows of the user table...

  ![Database error with the first rows of the user table](sqli-error-1.png)

  ... including email addresses and password hashes.

  ![Email addresses and password hashes in the same response](sqli-error-2.png)
  ```

  Rewrite: keep the source’s blank-line vs flush layout. From scratch: use the
  blank-line-before-and-after default.

### PoC requests and code blocks

- Introduce every block with a sentence saying what it shows, and follow it with
  what it proves.
- Payloads and URLs belong in fences or backticks, never as bare prose.
- Fences are tagged and may highlight the part that matters
  (`references/markdown-syntax.md`). Rewrite: an untagged fence whose first line
  names the language stays as it is.
- Naming a tool once (`sqlmap`, `nmap`) is enough.
- **Verbatim strings in evidence are frozen** (quoted groups, errors, field
  values), even if they look like typos. Open-prose typos may be fixed when the
  sentence is already being rewritten (content integrity). Do not redact
  secrets — the pentester owns redaction of text and screenshots.

### Appendix pointers

- Evidence that would bury the field — credential dumps, full host or subdomain
  inventories, scan exports, long console output — goes to an appendix file, and
  the field points at it instead of reproducing it.
- The pointer is short and names the file: `See appendix: leaked-credentials.csv`.
  It can stand in prose or as an `affected_components` entry
  (`references/affected-components.md`). German prefixes are in
  `references/german.md`.
- Point at an appendix only when there is one. The finding still has to stand on
  its own: the walkthrough, the decisive evidence, and the impact stay in the
  field.

## Examples

- Claim sentence, then captioned evidence:

  > The invoice was then retrievable without authentication at
  > `/invoices/<ID>`:
  >
  > ![Invoice PDF retrieved without a session cookie](invoice-unauth.png)

- Evidence not yet available:

  > We reset the password of an unrelated account and signed in with it.
  >
  > [TODO IMAGE]

- HTTP PoC:

  ```http
  POST /login HTTP/1.1
  Host: shop.example.com

  user=admin'--&password=x
  ```

## Avoid

- All figures clustered at the end; a figure inside a sentence.
- `![](file.png)` with no caption, or a caption that only repeats the claim
  sentence.
- Long console dumps when one request proves the point, or when the dump belongs
  in an appendix.
- An appendix pointer that replaces the walkthrough instead of relieving it.
"""

[[notes]]
title = "executive-summary.md"
id = "4c7a836e-3cd1-4ff8-94e3-0ef5bfd2a2bc"
type = "text"
parent = "6241e3a4-26dc-4f7f-9bfc-3d695aea9393"
order = 5
text = """# Executive summary

## Purpose

How `executive_summary` should read: the management-level picture of the whole
engagement. Per-finding `summary` is `references/finding-summaries.md`. German
close formula: `references/german.md`.

## Applies to

`executive_summary` only.

## Rules

- **Length: 3–7 short paragraphs, roughly 150–450 words** — an opener, one
  paragraph per important finding or chain, a collapsed leftovers sentence, and
  the close. A small engagement with one or two findings may land at two
  paragraphs plus the close. Rewrite: do not pad a short summary up to this
  range by adding findings it never covered.
- **Open with one intro on the overall state of the application or the
  organizational risk** — not a recap of finding 1, not a semicolon list of
  titles, not `title` of the report. Default: **one sentence** (up to a short
  paragraph). Name the impact objects (accounts, tenants, VPN, customer data),
  not endpoint paths.
  - **Derive the opener from the findings.** If testers demonstrated tenant
    takeover and live account compromise, say that. If the work is mostly
    hardening leftovers, say that. Do **not** invent a rosy polarity
    (“solid login process”, “robust security impression”) or a damning one
    (“not state of the art”) the findings do not support.
  - An attack *chain* that the findings actually form may be named as one
    organizational risk. Do not paste a chain sentence onto an unrelated
    finding list.
- **Then short business-impact paragraphs** for the important findings or
  chains — what an attacker gains, in management language. When the report
  uses finding links (`[](#<id>)`, `(Finding [](#<id>))`), link each important
  finding or chain. Rewrite: keep the source’s linking — do not add a link the
  sentence never had, and do not strip links that are already there.
- **Do not restyle this field into a table of finding summaries.** Skip
  scoring caveats, payload detail, and exploitability footnotes that only live
  in the finding unless they belong in the executive picture. Quantify when the
  number is already a report fact. Rewrite: keep such details only if the
  executive text already used them.
- **Collapse true leftovers** (outdated components, scan hardening) into one
  closing sentence. A distinct, listed issue (for example session enumeration
  that enables account discovery) gets its **own** paragraph — do not hide it
  inside “outdated software”.
- **Coverage of findings:** cover every important finding or chain, collapse
  true leftovers, and do not pad with every low finding. Rewrite: do not insert
  findings this summary never covered just because they exist in the finding
  list — expanding named items is restyle; adding an unnamed finding is a new
  fact.
- **Positive observations** (MFA that worked, rate limiting) are welcome when
  they calibrate the picture and the facts support them. Rewrite: include them
  only if the source already has them — do not invent controls from general
  knowledge of the stack.
- **Close clearly:** timely fix of critical and high risk; prioritize the rest
  (often as a continuous improvement process). Default wording:

  > We recommend remediating critical and high-severity findings first. All
  > other findings should be prioritized by effort and addressed as part of a
  > continuous improvement process.

  (`prioritised` if `language` is `en-GB`.) Variants that keep both elements
  (urgent high/critical + prioritized remainder) are fine. If the last listed
  item is only a low-risk leftover, the close may fold into that paragraph
  instead of repeating the critical/high formula. Always include a two-element
  close unless the leftover-fold applies. Rewrite: if the summary has **no**
  close, insert the default two-element close — that is style, not a new
  verdict.
- **Optional blocks, only when they belong:**
  - Future-test advice — do not seed it from a dropped duration hedge in
    `scope`.
  - Retest vs initial-test headings — when writing a *new* retest summary, or
    when the source already has them. Preserve the source’s date style.
    Rewrite: do not build those headings from `retest_notes` if the executive
    text never had a retest narrative.
  - Discussion topics from a review meeting — only if they were recorded;
    do not invent discussion topics.
- **Management register:** no CVSS vectors, no CVE numbers, no payloads, no
  tool syntax, no URL paths. Component names in business terms are expected
  (“VPN”, “customer portal”, “domain controller”).

## Examples

- Opener from demonstrated high impact:

  > During the penetration test we identified weaknesses through which an
  > attacker could fully take over the customer portal and read invoices stored
  > for all tenants.

- Then a finding paragraph:

  > Through SQL injection in the login form we obtained access to the user
  > database. That made takeover of arbitrary customer accounts possible.
  > (Finding [](#…))

- Weak opener (finding recap, no overall state):

  > SQL injection in login; missing MFA on the VPN; outdated libraries.

## Avoid

- Opening on a mechanism recap or a title list.
- Inventing polarity adjectives the findings do not earn.
- Importing finding-only caveats, hosts, or counts that do not belong in the
  executive picture. Rewrite: also do not import ones this summary never had.
- Padding with every low finding.
- Parameter names, status codes, or payloads.
- Dropping the closing prioritization line. Rewrite: adding a retest section
  the source never wrote.
"""

