text = """# Finding titles

## Purpose

Rules for finding `title`. What / who / how as needed; impact-first; sentence
case; most severe verified impact. German title connectors:
`references/german.md`.

## Applies to

Finding `title`.

## Rules

- **Impact first, concrete, short.** About 4–9 words. Sentence case: first word,
  proper nouns, and acronyms only. No trailing period, no severity adjective,
  no CVE/CWE. Severity lives in `cvss`.
  - Weak: `Critical issues in outdated software`
  - Better: `Issues in outdated software`
- **Do not title a vulnerability class when the impact is known.**
  `SQL Injection`, `Information disclosure`, `IDOR` tell the reader nothing
  about why they should care. Name the demonstrated outcome, then attach the
  path.
- **Who / what / how as needed.** Recurring English shapes:
  - `<Impact> by <actor> (<cause>)` — “Admin takeover by authenticated users (stored XSS)”
  - `<Impact> via <path>` — “Account takeover via stored XSS”
  - `<Component> without <control> enables <impact>`
  - `<Actor> access to <object>`
  - `<Object> in <location>`
  - `<Component> without <control>`
- Parentheses may hold the cause after the impact, or a qualifier the reader
  needs (“(staging only)”). Do not use parentheses only to dump a class name
  with no impact.
- **Most severe verified impact.** If the chain is local admin → domain users →
  all clients, title the end state, not a compound of every hop. Join two
  impacts with “and” only when they are co-equal and neither subsumes the other.
- Title **what was demonstrated**. If testers only showed that an attack is
  *possible*, title the risk (“Risk from shared helpdesk credentials”), not an
  unexecuted theft. Never ship a class-only title.
- **Compatible with the finding’s C/I/A.** Do not title a confidentiality
  compromise when the vector is `C:N`. Low (`C:L`) can still match a limited
  account takeover. Downstream effects that `cvss` does not score stay in
  `summary` / `description`.
- Aggregation findings title the shared impact **or** the missing control —
  prefer the impact when one dominates. A slash joining two classes
  (`Open Redirect / HTML Injection`) is not a title; rewrite to the outcome.
- Prefer a **clear two-line title** over a meaningless one-liner. If what /
  who / how cannot all fit, keep the impact and leave the rest off.
- English class names stay English where they are standard (CSRF, XSS, SQLi).
- Related findings in one report should use parallel construction.
- Rewrite: leave a title that already satisfies these rules unchanged. Fix only
  missing impact, class-only wording, severity labels, throat-clearing, or
  broken grammar at the end of an otherwise good title.

## Examples

- Weak → better:
  - `Cross-Site Scripting` → `Admin takeover of shop administrators (stored XSS)`
  - `Information disclosure` → `Public configuration file exposes the database password`
  - `Missing MFA` → `Missing MFA on the VPN enables takeover of remote access`
  - `Command Injection` → `Application server takeover by command injection`

## Avoid

- Class-only titles.
- Titling an impact the vector does not score.
- Copying a title from another engagement because it “sounds like” this finding.
"""

