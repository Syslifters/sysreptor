text = """# Finding descriptions

## Purpose

Rules for finding `description`. Observation → conclusion; numbered steps;
background when the stack is unfamiliar; limitations.

## Applies to

Finding `description`.

## Rules

- **Narrative walkthrough**, not a pile of facts. A standard finding is about
  3–12 sentences; multi-part findings and PoCs run longer via structure, not
  via walls of text.
- **Open with where and what.** A short temporal frame is fine (“During
  testing …”). Throat-clearing is not (“The following vulnerability describes
  …”, “Regarding area X …”).
- **Walk the reader to the conclusion:** entry point → our action → response →
  what an attacker with the same preconditions could do. Chain links in order.
- **Evidence after the claim it supports.** Each figure sits on its own line
  immediately after the sentence it proves, with one claim sentence per figure
  (`references/evidence-and-poc.md`). Do not cluster screenshots at the end.
  Where a screenshot is needed but not available to you, leave a
  `[TODO IMAGE]` placeholder for the pentesters to replace.
  Rewrite: if the source already attached several images to one statement, do
  not invent claim sentences to split the cluster. From scratch: consecutive
  figures are fine when they belong to one statement.
- **Numbered repro / PoC when there are steps.** Preconditions, exact URLs or
  commands, payloads, expected result. Short recipes use `1.` `2.` `3.` as
  first-person sentences. Long walkthroughs may use
  `#### Proof-of-Concept: <goal>` and `##### n. <step>` when there are
  distinct PoCs or named steps (heading depth and `{.in-toc .numbered}`:
  `references/markdown-syntax.md`). Name each PoC by its goal. Rewrite: copy
  the source’s heading wording; do not paraphrase a labeled PoC into a
  different title.
- **Sub-headings only for distinct sub-issues** (different control or impact
  path), typically bold. Sequential techniques that prove *one* issue stay as
  paragraphs + figures, without invented cluster titles. Rewrite: restore a
  heading the source still names; do not add headings a sequential description
  never had.
  - Distinct access vectors may be a numbered list with bold names
    (`1. **Reading other tenants’ invoices**: …`).
  - A sequential hijack walkthrough stays bare numbered sentences, not
    `1. **Label**:`.
- Order sub-parts by severity (worst path first). Positive context follows the
  weakness it contextualizes, it does not bury it.
- **Flattened inventories become lists.** Domain→account-type maps, library
  inventories, and attribute lists belong in bullets, not run-on prose.
  Component inventories may use a short bold class label plus where we saw them.
- **Technical notation:** backticks for endpoints, parameters, files, and
  commands; status codes with their reason phrase (`` `401 Unauthorized` ``);
  error text quoted verbatim; full URLs when the path matters. Markup details
  are in `references/markdown-syntax.md`.
- **Mechanism in one or two sentences** — why the behavior is exploitable.
  Vulnerability-class tutorials belong behind a footnote, not in the body.
- **Background** when the finding needs niche stack knowledge: two to three
  sentences before the walkthrough (what the technology is and how it is used
  here). Not product documentation.
- **Systems, not people.** Attribute issues to missing controls,
  misconfigurations, or code. Prefer roles over employee names. No blame
  language and no speculation about why someone chose a setting.
- **Close with real limitations** (“We cannot rule out that …”, “The named
  endpoints are exemplary”). Drop a completeness disclaimer that only repeats
  an already-stated “sampled / spot-checked” note.
- Tester observation of a missing control → “We determined that …”.
  Stable mechanism → the content verb. Client-stated facts keep their marker
  (`SKILL.md`, impact and certainty).
- Keep a short bridge sentence where testers ran PoCs to show criticality;
  strip only fluff tails. Rewrite: keep the source’s finite-verb choice.
- Restate technical impact once after the evidence. Remediation belongs in
  `recommendation`: no fix list here, and a one-line pointer to the control
  pattern is enough if the walkthrough needs it. Rewrite: a short de-hedged
  hint already in the source may stay, never a fix list.

## Examples

- Observation → response → implication:

  > The login form at `https://shop.example.com/login` evaluated the `user`
  > parameter in a SQL query. We submitted a classic injection in the username;
  > the server responded with a database error and then with rows from the user
  > table.
  >
  > ![Database error followed by rows from the user table](sqli-user-table.png)
  >
  > That allowed us to take over arbitrary customer accounts.

- Limitation: “We cannot rule out that further endpoints share the same missing
  object check. The named paths are exemplary.”

## Avoid

- Theory dumps; walls of more than ~5 sentences without a break, figure, or list.
- Steps without numbers when order matters.
- Conclusions without the path; figures without a claim sentence.
- Copying `recommendation` bullets into `description`.
- Blame language or employee names.
- Inventing bold sub-headings on a sequential walkthrough, or flattening a
  named multi-vector list into “Additionally … Furthermore …” prose.
"""

