order = 10
text = """# Markdown syntax

## Purpose

The markdown dialect the reports render with: CommonMark plus the extensions
this renderer adds (figures from images, table captions, manual highlighting in
code blocks, inline footnotes, attribute braces).

`SKILL.md` carries the handful of markup defaults needed on every prose field —
heading depth, list markers, backticks and bold, the two figure forms, tagged
fences. This file explains and exemplifies those, and is the only place that
covers the rest. Read it when a field needs a table, a highlighted request, a
diagram, an attribute, or raw HTML, or when the defaults leave a question open.

This file owns **how** to write a construct. **When** to use one stays with the
field: evidence placement in `references/evidence-and-poc.md`, list structure in
`references/recommendations.md`, sub-headings in
`references/finding-descriptions.md`, links in
`references/references-and-crosslinks.md`.

## Applies to

Every markdown-bearing prose field: `description`, `summary`,
`recommendation`, `retest_notes`, `scope`, `executive_summary`.

## Rules

### Headings

- The design supplies the report and finding headings, so field prose starts no
  higher than `####`. Inside a `description`, `#### Proof-of-Concept: <goal>`
  with `##### n. <step>` beneath it is the deepest structure that is normally
  needed (`references/finding-descriptions.md`).
- Never `#`, `##`, or `###` inside a field — they collide with the design’s own
  levels.
- `{.in-toc .numbered}` on a heading puts it in the table of contents and
  numbers it. Add it on `####` headings that a reader would navigate to:
  named Proof-of-Concept blocks and distinct sub-issues. Skip it on `#####`
  step headings and on any heading that would only clutter the ToC. Rewrite:
  keep the flag where it is; add it when a navigable `####` is missing it;
  do not strip it.

### Emphasis

- `**bold**` sparingly, for a critical identifier or count — never a whole
  sentence.
- `_italic_` for the cross-link form the reports use (`_[](#<id>)_`) and for a
  rare emphasis; do not italicize technical strings, which take backticks.
- Backticks for endpoints, parameters, files, commands, status codes, and field
  values.
- `~~strikethrough~~` is not how a fixed issue is marked. Retest state belongs
  in `retest_status` / `retest_notes` (`references/retest-fields.md`).
- Markdown has no underline; it needs `<u>…</u>`. Do not use it — underlined
  text reads as a broken link.

### Lists

- `*` or `-` for bullets, **one marker per field**, adjacent bullets with no
  blank lines between them. Nested items are indented under their parent.
- `1.` `2.` `3.` for anything where order matters (repro steps, PoC stages).
- A single item is written as a plain sentence, without a marker.

### Images and figures

- An image is standard markdown and renders as a figure whose **caption is the
  alt text**: `![Caption](screenshot.png)`. Alt text is mandatory —
  `![](screenshot.png)` renders a figure with an empty caption.
- Optional sizing goes in attribute braces: `![Caption](screenshot.png){width="50%"}`.
- `[TODO IMAGE]` is the placeholder for a screenshot the pentester still has to
  insert. It is not markdown, carries no caption, and is replaced by a real
  image reference later.
- Two screenshots that prove one statement may be paired in one figure:

  ```html
  <figure class="figure-side-by-side">
    <img src="request.png" />
    <img src="response.png" />
    <figcaption>Request and response of the forged password change</figcaption>
  </figure>
  ```

- Placement, density, and what the surrounding prose must say are in
  `references/evidence-and-poc.md`.

### Tables

- GFM syntax, plus a caption on the line after the table, introduced with `: `.
  Give every table a caption.
- Cells hold short values. The syntax supports no rowspan, colspan, or
  multiline cells — fall back to inline HTML only when one of those is really
  needed.
- A client-supplied HTML table (IP and interface inventories, for example) stays
  as supplied; do not tidy its markup into markdown
  (`references/scope-and-methodology.md`).

### Code blocks

- Fence every block and tag it with its language (`http`, `sql`, `shell`,
  `json`, …). Preserve an existing info string rather than replacing it.
- To point at the part that matters, add `highlight-manual` to the info string
  and wrap that part in `§§…§§`. Use it for the injected parameter or the
  telling response header, not for whole blocks.
- If the payload itself contains `§`, choose another escape character:
  `http highlight-manual="|"`, then wrap with `|…|`.
- Preserve highlight markers the source already has; do not invent them for a
  block that never had any.

### Footnotes

- Inline, at the mention: `LDAP signing^[<https://…>]`. When to footnote versus
  cross-link is in `references/references-and-crosslinks.md`.

### Mermaid

- A fenced `mermaid` block renders as a captioned figure. Its info string
  carries the caption:

  ~~~
  ```mermaid caption="Attack chain from the VPN to the domain controller"
  flowchart LR
    VPN --> Workstation --> DomainController
  ```
  ~~~
- Worth it only for an attack chain or an architecture the prose cannot carry.
  Always caption it, never decorate with it, and never draw a step the evidence
  does not support.

### Math

- `$…$` and `$$…$$` render formulas. Do not typeset CVSS arithmetic. Use only
  if necessary.

### Attribute braces and inline HTML

- Braces set attributes directly after the element:
  `{#id .class width="50%"}`. Use `width` where an image needs sizing. On
  headings, `{.in-toc .numbered}` is the allowed exception (see Headings
  above). Do not invent other ids or classes; they belong to a design you
  cannot see. Keep attributes the source already carries.
- Inline HTML is the escape hatch for what markdown cannot express (side-by-side
  figures, complex tables, `<u>`). Markdown embedded inside an HTML block needs
  a blank line separating it from the surrounding tags.

## Examples

- Highlighted PoC request:

  ```http highlight-manual
  POST /api/users/change-password HTTP/1.1
  Host: shop.example.com
  Content-Type: application/x-www-form-urlencoded

  §§user=4711§§&password=Sommer2026
  ```

- Captioned evidence after the sentence it proves:

  > The response contained the first rows of the user table:
  >
  > ![Database error revealing user table rows](sqli-error.png)

- Table with a caption:

  ```
  | Host                  | Environment |
  | --------------------- | ----------- |
  | shop.example.com      | production  |
  | staging.example.com   | staging     |

  : Tested hosts and their environments
  ```

## Avoid

- `#`, `##`, or `###` inside a field; underline; strikethrough as a fix marker.
- `![](file.png)` with no alt text, or an image reference inside a sentence.
- Untagged fences; invented highlight markers; a fence used for a single
  identifier that belongs in backticks.
- Mixing `*` and `-` inside one field.
- Uncaptioned tables and mermaid figures.
- Invented ids and classes, KaTeX formulas if unneeded, and HTML where markdown would do.
"""

[[notes]]
title = "recommendations.md"
id = "5e732cea-ad7f-481a-97a5-62859b30f60e"
type = "text"
parent = "6241e3a4-26dc-4f7f-9bfc-3d695aea9393"
order = 11
text = """# Recommendations

## Purpose

Rules for `recommendation`. Control patterns, not patch specs; bullets;
imperative main actions; skip already-implemented controls; trade-offs;
root-cause-first. German verb forms: `references/german.md`.

## Applies to

Finding `recommendation`, and follow-up advice inside `retest_notes`.

## Rules

- **Actionable bullets, one action each**, complete sentences. Typically 1–6
  points (often 2–4). A **single** recommendation is one plain sentence,
  **no** bullet marker. Sub-bullets hold alternatives or extra hardening under
  their parent. One list marker per field
  (`references/markdown-syntax.md`); rewrite keeps the field’s existing marker.
- **Verb forms by role.** Imperative is the default for an important action;
  keep one dominant style per finding, and mixing inside a finding is fine when
  the *roles* differ:
  - **Concrete config / system change** → imperative (“Ensure that …”,
    “Reset …”, “Disable …”, “Validate … against an allow-list”, “Enforce MFA
    on the VPN”).
  - **Process or program advice** → “We recommend …”
    (“We recommend regularly monitoring leaked credentials.”).
  - **Hard requirements** may use must / shall.
  - Do not default to should. Rewrite: a **system-oriented should** the source
    already uses is legitimate — do not mass-convert should → imperative, or
    the reverse.
- **Keep real optionality.** Trailing “conceivable”, trade-off “could”, and
  nested alternatives stay optional. Do **not** turn optional hardening into a
  hard must. “Where possible” is a content qualifier: keep it on the restyled
  imperative.
- A **sibling concrete control** whose only hedge is a degraded wrapper
  restyles to imperative. That is not the optional-hardening freeze.
- **Restyle degraded wrappers**, keep the action:
  - “It is recommended that …” / “It should be ensured that …”
    → imperative or “We recommend …”, by role above.
  - Drop whole extra bullets that are only fluff (“best practices should be
    considered”, “a holistic review appears advisable”).
- **Order:** root-cause fix, then defense in depth, then optional hardening.
  Urgent containment first or flagged in the bullet.
- **Name the control pattern** in plain language. A concrete endpoint may be
  named for precision; no patch-spec walkthrough.
- One short explainer sentence inside a bullet is allowed (what MFA is);
  do not grow it into a tutorial.
- Trade-offs inline when the fix is disruptive.
- Cross-link another finding’s recommendations instead of repeating them
  (`references/references-and-crosslinks.md`).
- **Do not recommend controls already verified as working.** If a related
  control is present but incomplete, recommend only the missing part.
- Compensating controls (WAF, rate limiting, network segmentation) are
  **interim**; the primary bullet still names the root-cause fix.
- Prefer natural control language over stiff policy phrasing (“check that the
  logged-in user may change this account”, not “derive the authenticated user
  from the server-side session”).
- Multi-part findings: recommendations per sub-part, mirroring distinct
  description headings.
- Restore flattened prose to bullets, one bullet per distinct action, and
  restore parent/child nesting. Rewrite: do not lift alternatives into extra
  mains, and do not split one source bullet that is action + continuation.

## Examples

- Concrete + process + optional (missing MFA on VPN):

  ```
  - Enforce multi-factor authentication for all VPN logins.
  - We recommend also binding privileged remote access to managed devices.
      - Until that is possible, restricting access to the office network is
        conceivable.
  ```

- Single recommendation, no bullet: “Validate available payment methods
  server-side and enforce them.”

- Too much like a patch: extract the user ID exclusively from the session and
  compare it with the `user` parameter of `POST /api/users/change-password`.
  Better: “Authorize every password change: the logged-in user may change only
  their own account.”

## Avoid

- Numbered how-to / parameter-level specs (that is `description`).
- Second-person “you should” / “you must” as the main voice.
- Fragment bullets (“Rate limiting.”).
- Generic filler (“implement security best practices”).
- Promoting optional / trade-off hedges to a must.
- Recommending what already works.
- Symptom-only compensating controls with no root-cause fix.
- Marker wars or copying another finding’s `*` vs `-`.
"""

[[notes]]
title = "references-and-crosslinks.md"
id = "d2a45bee-b0cd-49db-b3f0-1c4f211be906"
type = "text"
parent = "6241e3a4-26dc-4f7f-9bfc-3d695aea9393"
order = 12
text = """# References and crosslinks

## Purpose

How to point at other findings and external resources. There is no dedicated
`references` field — links live in prose. Link and footnote syntax is in
`references/markdown-syntax.md`.

## Applies to

`summary`, `description`, `recommendation`, `retest_notes`, `scope`,
`executive_summary`.

## Rules

- **Finding cross-links** use the target id: `[](#<id>)`. Valid shapes:
  - “([](#<id>))”
  - “(Finding [](#<id>))”, “(see finding: _[](#<id>)_)”
  - inline: “via the path described in [sensitive data in GET requests](#<id>) …”
- **Link the chain where it is first explained**, once per field. Use real
  finding ids from the report; never invent one. Recommendations may point at
  another finding’s advice: “(see recommendations of finding: _[](#<id>)_)”.
  Rewrite: keep the links the source already has, and do not add a link to a
  sentence that never had one just because siblings are linked.
- **External references:** a footnote on the mention
  (`LDAP signing^[<https://…>]`) or an inline markdown URL that says
  what it is. Plain URL lists belong in `scope` only.
- **No CVE, CWE, or OWASP-category lists** unless the user asks. Software
  may be described as having “known vulnerabilities”; do not enumerate
  CVE-IDs in `title`, `summary`, or `description`.
- Footnotes sit at the end of a description or on the recommending bullet —
  not in their own section. Put the footnote on its own line at the end of the
  field or bullet. Rewrite: keep the source’s line wrap on the closing `]`.

## Examples

- Chain in a summary: combined with the missing object check ([](#<id>)),
  knowing the invoice ID is enough.
- Footnoted vendor doc: “Enforce LDAP signing on the domain controllers.^[…]”

## Avoid

- Referring to “the finding above” without a link, in *new* writing.
- Bare URLs dropped into a sentence.
- Footnotes that point nowhere.
- CVE/CWE/OWASP-Top-10 inventories as decoration.
"""

[[notes]]
title = "report-metadata.md"
id = "75ebd6a8-068a-4174-b35c-c34a3bb21a60"
type = "text"
parent = "6241e3a4-26dc-4f7f-9bfc-3d695aea9393"
order = 13
text = """# Report metadata

## Purpose

How the short identifying fields of the report should read, and the single
source for the `language` default. Prose fields are
`references/scope-and-methodology.md` and
`references/executive-summary.md`; history is
`references/document-history.md`.

## Applies to

`title` (report), `customer`, `report_date`, `start_date`, `end_date`,
`retest_date`, `is_retest`, `lead_pentester`, `language` — whichever of them the
report design has.

## Rules

- **Report `title` names the tested target**, not the document type. Short
  (about 2–8 words), no dates, no “penetration test” prefix, no severity or
  verdict. Join multiple targets with `/` or `&` when that is how the
  engagement was scoped.
  Rewrite: leave a compliant target title alone; do not expand it with “web
  application” and do not swap a working joiner.
- **Dates are ISO `YYYY-MM-DD`.** `report_date` is the release date; `start_date`
  / `end_date` are the test window; `retest_date` only when a retest happened.
  Ask if a required date is unknown; do not invent one.
  From scratch: `report_date` matches the newest `document_history` release.
  Rewrite: **do not “correct” an existing mismatch** between `report_date` and
  history — dates are facts.
- **`is_retest`** is set only for retest engagements. Initial-only reports omit
  it. Finding-level retest fields belong with `references/retest-fields.md`.
  From scratch on a retest: `scope` and `executive_summary` describe the retest.
  Rewrite: the flag does not license rewriting those fields into a retest
  narrative the source never had.
- **Duration** (person-days, optionally including report writing) lives in
  `scope`, not here.
- **`lead_pentester`** carries `email`, `name`, `phone` as placeholders
  (`<EMAIL-1>@example.com`, an existing person token, `<PHONE-1>`).
- **`language`** is `en-US` for English reports, `en-GB` where that is the
  locale in use, and any `de-*` locale for German (`de-DE` when German is asked
  for without a variant). This is the default other files defer to: an English
  report is `en-US` unless the user or the source says otherwise, and a German
  report keeps its `de-*` locale and the overlay in `references/german.md`.
  Rewrite: do not change an existing `language` value, and do not rewrite a
  German report into English or the reverse because a skill example used the
  other language.

## Examples

- Report titles, weak → better:
  - `Penetration test report 2026` → `Customer portal (login flow)`
  - `Critical issues in the webshop` → `Shop & accounting`
  - Multiple targets in one engagement: `Active Directory / internal infrastructure`
- Dates for an initial test released the day after it ended:

  ```
  start_date  = 2026-04-13
  end_date    = 2026-04-17
  report_date = 2026-04-18
  ```

- Retest metadata: `is_retest = true` with `retest_date = 2026-05-08`, and the
  matching `Retest` entry in `document_history`.

## Avoid

- Verdict language or “pentest report” in the report `title`.
- Non-ISO dates; inventing `retest_date` without a retest.
- Un-anonymized customer or pentester values.
- Using `is_retest` to fabricate retest prose in other fields.
"""

[[notes]]
title = "retest-fields.md"
id = "53c187e2-9bad-4fc1-b24a-faff852eb69b"
type = "text"
parent = "6241e3a4-26dc-4f7f-9bfc-3d695aea9393"
order = 14
text = """# Retest fields

## Purpose

How `retest_status` and `retest_notes` should read, and how retest information
stays out of the original finding body. German status formulas:
`references/german.md`.

## Applies to

`retest_status`, `retest_notes`. Used together with `is_retest`
(`references/report-metadata.md`).

## Rules

- In a retest report, **every original finding** gets `retest_status`. Findings
  first reported at retest omit both fields. Reports without a retest omit them
  everywhere.
- **`retest_status` values** (exact strings):
  - `resolved` — fully fixed
  - `partial` — some sub-parts fixed
  - `changed` — behavior changed, issue remains in a new form
  - `open` — not fixed
- **`retest_notes` length follows the status:**
  - `resolved` — one sentence, or an empty string.
  - `open` — one to three sentences: what we retested and that the behavior is
    unchanged.
  - `partial` / `changed` — substantive, about 2–8 sentences or a bullet per
    residual issue, naming every part that remains and every part that is fixed.
  - Rewrite: if the notes field is **absent**, leave it absent — do not invent
    `""` or a placeholder sentence.
- **Never rewrite the original finding’s facts** into the retest state.
  Observations, counts, hedges, verbatim strings, figures, `cvss`, and implied
  severity of the original stay. Style of that original prose may still be
  improved (content integrity). New evidence, new residual issues, and updated
  assessment go in `retest_notes`. A changed severity updates `cvss` and is
  explained here (`references/cvss-scoring.md`).
- **Useful structures** (combine as needed):
  - Temporal frame: “At the time of the pentest in <Month Year> …” then what
    we re-verified, with fresh figures.
  - Dated status blocks, **newest first** — the opposite of `document_history`,
    which runs earliest first (`references/document-history.md`):
    `**Status 2026-05-08:** This finding is now resolved.`
  - Per-sub-part breakdown that repeats the description’s distinct headings,
    each with its own status line and evidence.
  - Bullet list of what remains, one residual issue each; follow-up advice
    uses `references/recommendations.md`.
- Content: what we retested and how, what changed, evidence, updated
  assessment. PoC detail for newly found residuals belongs here, not in the
  frozen `description`. Figures follow `references/evidence-and-poc.md`.
- A retest engagement also adds a `document_history` entry and `retest_date`
  (`references/document-history.md`, `references/report-metadata.md`).

## Examples

- Partial: “The SQL injection in the login form is closed. Unauthenticated
  export via `/api/export` is still possible. We consider the finding partially
  resolved.”
- Dated, newest first:

  > **Status 2026-05-08:** This finding is now resolved.
  >
  > **Status 2026-04-16:** The payment method was still selectable.
  >
  > ![Disabled payment method still selectable at checkout](retest-payment.png)

- Resolved one-liner: “No longer reproducible on retest.”

## Avoid

- Mutating original `summary` / `description` to describe the retest.
- `partial` / `changed` without saying which parts remain.
- Claiming a fix with no verification, when we did verify — or the reverse:
  claim a fix we could not check.
- Retest fields on findings that were never in the original test; omitting
  them on original findings in a retest report.
- Inserting notes on an `open` finding that shipped without them.
"""

[[notes]]
title = "scope-and-methodology.md"
id = "e0932fc0-a46f-42e1-9a90-61cf35af7574"
type = "text"
parent = "6241e3a4-26dc-4f7f-9bfc-3d695aea9393"
order = 15
text = """# Scope and methodology

## Purpose

What `scope` must make clear. There is no separate methodology field: approach,
access, and duration live here.

## Applies to

`scope` only.

## Rules

- **Clear and complete**, usually 1–6 short paragraphs plus lists. Prose first;
  lists for enumerations. No findings, no impact statements, no fix lists other
  than deprovisioning.
- Cover the slots that apply — an inclusion checklist, not a forced order.
  Check the notes if target, duration, or access is unknown; if still unknown,
  ask. Rewrite: keep the source order and **do not invent a slot the source
  never had.**

  1. **Target** — what was tested, named concretely (application, forest, realm,
     linked systems). State out-of-scope or untested parts, including time
     limits (“we could not test this due to time constraints”).
  2. **Approach** — only if the engagement actually named one (grey-box,
     white-box, assumed-compromised, …). Access evidence (provided accounts, a
     test environment) is **not** a license to infer a label. First person is
     the default for tester actions. Rewrite: an already impersonal approach
     sentence may stay impersonal; do not rewrite a labeled first-person
     approach into a generic agentless formula.
  3. **Duration** — person-days, with an optional clause such as “including
     report writing”; include that clause when person-days cover report
     writing. Drop filler about the window being “rather tight”; keep the
     number. Do not move that comment into `executive_summary`. Rewrite: keep
     the source’s wording of that clause.
  4. **Where** — tested URLs or hosts as a list when they are not already under
     the target sentence. Keep environment labels as written (`staging`, `test
     system`, `production`).
  5. **Access** — accounts or clients, grouped by role when roles are known.
     Split provided vs self-registered when that is how the accounts were
     obtained. Rewrite: keep that split **only when the source already splits
     them** — a mixed list stays mixed; do not invent which account was whose.
  6. **Deprovisioning** — last or near-last when accounts or clients were used:
     recommend deactivating or deleting test identities. Rewrite: restyle fluff
     to a clear recommendation and keep the source’s action wording.

- **Retest:** a new retest `scope` describes the retest window. Rewrite:
  restyle the existing `scope`; `is_retest` does not mean rewriting an
  initial-test scope into “The retest covered …”.
- Optional when they apply: priority tiers, tester source IPs, a note that
  production data was touched and the client must verify. A client-supplied
  HTML table of IPs/interfaces stays as supplied — do not tidy markup into
  markdown (`references/markdown-syntax.md`).

## Examples

- Target + duration + approach:

  > The pentest covered the customer portal and the related VPN login. The test
  > window was 6 person-days including report writing.
  >
  > We performed the test as a grey-box engagement. The client provided
  > credentials and a test environment.

- Unlabeled approach (do not invent grey-box):

  > The scope covered the internal time-tracking system over 5 person-days. The
  > following accounts were provided or self-registered for the test: …

- Deprovisioning: “At the end of the pentest we recommend deactivating or
  deleting the provided user accounts.”

## Avoid

- Naming the target but omitting duration or access when those existed.
- Inventing grey-box / white-box / assumed-compromised because credentials
  appear in the list.
- Testing narrative (“First we scanned …”) — that belongs in `description`.
- Forgetting deprovisioning when test accounts were used.
- Splitting a mixed account list into invented provided vs self-registered
  groups.
"""