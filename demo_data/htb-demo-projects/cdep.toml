[report_data]
title = "CDEP"
executive_summary = """{{ report.customer_full }} was breached in a full-chain intrusion spanning a user workstation, the domain controller, a Linux build server, and additional workstations. In total, five machines were involved: one Domain Controller, three Windows workstations, and one Linux server. Incident response is complete: containment and eradication are done. During the intrusion, the SOC captured a comprehensive telemetry corpus (Sysmon, multiple ETW providers, ETW-TI, Windows Security, and Linux auditd) and preserved the recovered adversary tooling in an analysis store.

{{ report.candidate.name }} joined {{ report.customer_short }} as a Detection Engineer. The mandate is not to re-investigate the incident. It is to build the detection content that would have caught each stage of this intrusion, and to validate every analytic against the captured corpus so that only rules proven to fire are shipped. The captured telemetry is the validation dataset; the recovered samples are the reference for designing behavior-based detections that survive a rebuild, rather than brittle IOC rules.

Each analytic, together with its validation evidence, must be documented in this report in an understandable, technically robust, and reproducible way.
"""
techniques_overview = """Reference for Detection Coverage:

* **High:** Detection is based on hard-to-change behaviors or strong telemetry, and is resilient to simple evasion.
* **Medium:** Detection is useful but can be bypassed with moderate effort, or is sensitive to environmental variance.
* **Low:** Detection is fragile or noisy. It relies mostly on easy-to-change indicators.

